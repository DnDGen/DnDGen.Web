<div [id]="id">
  <dndgen-searchable-select [id]="id + 'Add'"
                            [options]="templates"
                            [clearOnSelect]="true"
                            placeholder="Add a template"
                            (valueChange)="add($event)">
  </dndgen-searchable-select>
  @if (selected.length == 0) {
    <span class="italicize template-list-empty">{{emptyText}}</span>
  } @else {
    <ol class="list-group list-group-numbered template-list">
      @for (template of selected; track $index) {
        <li class="list-group-item d-flex align-items-center">
          <span class="template-name ms-2 me-auto">{{template}}</span>
          <button type="button" class="btn btn-sm btn-outline-dark template-up" [attr.aria-label]="'Move ' + template + ' up'" [disabled]="$first" (click)="moveUp($index)"><i class="bi bi-arrow-up"></i></button>
          <button type="button" class="btn btn-sm btn-outline-dark template-down ms-1" [attr.aria-label]="'Move ' + template + ' down'" [disabled]="$last" (click)="moveDown($index)"><i class="bi bi-arrow-down"></i></button>
          <button type="button" class="btn btn-sm btn-outline-danger template-remove ms-1" [attr.aria-label]="'Remove ' + template" (click)="remove($index)"><i class="bi bi-x-lg"></i></button>
        </li>
      }
    </ol>
  }
</div>
