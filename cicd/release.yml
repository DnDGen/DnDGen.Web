trigger: none
pr: none

resources:
  pipelines:
  - pipeline: DnDGen.Web
    source: 'DnDGen.Web - Build'
    trigger: 
      branches:
      - main

jobs:

# The RollGen API
- deployment: RollGen_Api
  displayName: Deploy RollGen API
  pool:
    vmImage: 'windows-latest'
  environment: Prod
  strategy:
    runOnce:
      deploy:
        steps:
        - template: templates/api-deploy-steps.yml
          parameters:
            appName: rollgen-api
            apiPrefix: roll
            smokeTestCollection: RollGen-API.postman_collection.json
            smokeTestJunitFile: rollgen.smoke.xml
            websiteTestScript: test:integration:ci:rollgen
            websiteResultFile: rollgen.website.xml
      on:
        failure:
          steps:
          - template: templates/api-rollback-steps.yml
            parameters:
              appName: rollgen-api
              rollbackZip: DnDGen.Api.RollGen.zip
     
