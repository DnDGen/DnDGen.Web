parameters:
- name: appName
  type: string
- name: apiPrefix
  type: string
- name: smokeTestCollection
  type: string
- name: smokeTestJunitFile
  type: string
- name: websiteTestScript
  type: string
- name: websiteResultFile
  type: string
- name: hasWebsiteTests
  type: boolean
  default: true

steps:
- task: AzureFunctionApp@2
  displayName: 'Deploy Azure Function App'
  inputs:
    connectedServiceNameARM: 'Azure - DnDGen'
    appType: 'functionApp'
    appName: '${{ parameters.appName }}'
    package: '$(Pipeline.Workspace)/**/${{ parameters.appName }}/*.zip'

- script: 'npm install -g newman'
  workingDirectory: '$(Pipeline.Workspace)'
  displayName: 'Install Newman'

- script: |
    newman run "$(Pipeline.Workspace)\DnDGen.Web\dndgen-smoke-api-tests\${{ parameters.smokeTestCollection }}" \
    --env-var "host=${{parameters.apiPrefix}}.dndgen.com" \
    --reporters cli,junit \
    --reporter-junit-export "Results\${{ parameters.smokeTestJunitFile }}"
  displayName: 'Run Smoke Tests'
  retryCountOnTaskFailure: 1

- task: PublishTestResults@2
  displayName: 'Publish API Smoke Test Results'
  condition: always()
  inputs:
    testResultsFiles: '**/*.junitReport.xml'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true

- ${{ if parameters.hasWebsiteTests }}:
  - task: UseNode@1
    displayName: 'Install node.js'
    inputs:
      version: '20.x'

  - script: 'npm install -g @angular/cli'
    displayName: 'Install Angular CLI'
  - script: 'npm install'
    workingDirectory: '$(Pipeline.Workspace)\DnDGen.Web\dndgen-deployment-website-tests'
    displayName: 'npm install'
  - script: 'npm run ${{ parameters.websiteTestScript }}'
    workingDirectory: '$(Pipeline.Workspace)\DnDGen.Web\dndgen-deployment-website-tests'
    displayName: 'Run Website Tests'

  - task: PublishTestResults@2
    displayName: 'Publish Website Test Results'
    condition: always()
    inputs:
      testResultsFiles: '$(Pipeline.Workspace)\DnDGen.Web\dndgen-deployment-website-tests\${{ parameters.websiteResultFile }}'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
