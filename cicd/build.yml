pool:
  vmImage: 'windows-latest'

variables:
  solution: 'DnDGen.Apis.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

jobs:
# The RollGen API
- template: templates/api-build-job.yml
  parameters:
    apiName: RollGen
    projectPath: DnDGen.Api.RollGen
    artifactName: rollgen-api
    smokeTestCollection: RollGen-API.postman_collection.json
    smokeTestJunitFile: rollgen.smoke.xml

# The TreasureGen API
- template: templates/api-build-job.yml
  parameters:
    apiName: TreasureGen
    projectPath: DnDGen.Api.TreasureGen
    artifactName: treasuregen-api
    smokeTestCollection: TreasureGen-API.postman_collection.json
    smokeTestJunitFile: treasuregen.smoke.xml

# The CreatureGen API
- template: templates/api-build-job.yml
  parameters:
    apiName: CreatureGen
    projectPath: DnDGen.Api.CreatureGen
    artifactName: creaturegen-api
    smokeTestCollection: CreatureGen-API.postman_collection.json
    smokeTestJunitFile: creaturegen.smoke.xml

# The CharacterGen API
- template: templates/api-build-job.yml
  parameters:
    apiName: CharacterGen
    projectPath: DnDGen.Api.CharacterGen
    artifactName: charactergen-api
    smokeTestCollection: CharacterGen-API.postman_collection.json
    smokeTestJunitFile: charactergen.smoke.xml

# The EncounterGen API
- template: templates/api-build-job.yml
  parameters:
    apiName: EncounterGen
    projectPath: DnDGen.Api.EncounterGen
    artifactName: encountergen-api
    smokeTestCollection: EncounterGen-API.postman_collection.json
    smokeTestJunitFile: encountergen.smoke.xml

# The DungeonGen API
- template: templates/api-build-job.yml
  parameters:
    apiName: DungeonGen
    projectPath: DnDGen.Api.DungeonGen
    artifactName: dungeongen-api
    smokeTestCollection: DungeonGen-API.postman_collection.json
    smokeTestJunitFile: dungeongen.smoke.xml

# The Web API
- template: templates/api-build-job.yml
  parameters:
    apiName: Web
    projectPath: DnDGen.Api.Web
    artifactName: dndgen-web-api
    smokeTestCollection: Web-API.postman_collection.json
    smokeTestJunitFile: web.smoke.xml

# The DnDGen Website
- job: DnDGen_Web
  displayName: DnDGen Website
  steps:
  - checkout: self
    displayName: 'Checkout Code'
    persistCredentials: true
  - bash: 'npm install -g @angular/cli newman'
    displayName: 'Install Angular CLI and Newman'
  - bash: 'npm install'
    workingDirectory: '$(Build.SourcesDirectory)/dndgen-web'
    displayName: 'npm install'
  - bash: 'npm run build:ci'
    workingDirectory: '$(Build.SourcesDirectory)/dndgen-web'
    displayName: 'Build'
  - bash: 'npm run test:unit:ci -- --output-file=./website-unit.xml'
    workingDirectory: '$(Build.SourcesDirectory)/dndgen-web'
    displayName: 'Run Unit Tests'
  - template: templates/publish-test-results.yml
    parameters:
      resultFile: '$(Build.SourcesDirectory)/dndgen-web/website-unit.xml'
  - bash: 'npm run test:integration:ci -- --output-file=./website-integration.xml'
    workingDirectory: '$(Build.SourcesDirectory)/dndgen-web'
    displayName: 'Run Integration Tests'
  - template: templates/publish-test-results.yml
    parameters:
      resultFile: '$(Build.SourcesDirectory)/dndgen-web/website-integration.xml'
  - bash: |
      ng serve &
      echo $! > /tmp/ng-serve-pid.txt
      echo "ng serve starting (PID: $(cat /tmp/ng-serve-pid.txt))..."
      timeout=120; elapsed=0
      until curl -s http://localhost:4200 > /dev/null 2>&1; do
        echo "Waiting 3s for ng serve to be ready..."
        sleep 3
        elapsed=$((elapsed + 3))
        if [ $elapsed -ge $timeout ]; then
          echo "ng serve failed to start within ${timeout}s"
          exit 1
        fi
      done
      echo "ng serve ready after ${elapsed}s"
    workingDirectory: '$(Build.SourcesDirectory)/dndgen-web'
    displayName: 'Start Website'
  - bash: |
      newman run "$(Build.SourcesDirectory)/cicd/smoke-tests/DnDGen-Website.postman_collection.json" \
      --env-var "host=localhost:4200" \
      --reporters cli,junit \
      --reporter-junit-export "$(Build.SourcesDirectory)/Results/website.smoke.xml"
    displayName: 'Run Website Smoke Tests'
    retryCountOnTaskFailure: 1
  - template: templates/publish-test-results.yml
    parameters:
      resultFile: '$(Build.SourcesDirectory)/Results/website.smoke.xml'
  - task: PublishBuildArtifacts@1
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    displayName: Publish Website Artifacts
    inputs:
      ArtifactName: 'dndgen-web'
      PathtoPublish: '$(Build.SourcesDirectory)/dndgen-web/dist'
      publishLocation: 'Container'
      
- job: publish
  displayName: Publish Artifacts
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  dependsOn:
  - RollGen_API
  - TreasureGen_API
  - CreatureGen_API
  - CharacterGen_API
  - EncounterGen_API
  - DungeonGen_API
  - Web_API
  - DnDGen_Web
  steps:
  - checkout: self
    displayName: 'Checkout Code'
    persistCredentials: true

    # Smoke Tests
  - task: PublishPipelineArtifact@1
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    displayName: Publish Smoke API Test Artifacts
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/cicd/smoke-tests'
      artifactName: 'dndgen-smoke-api-tests'
  - task: PublishPipelineArtifact@1
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    displayName: Publish Website Smoke Test Artifacts
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/dndgen-web' 
      artifactName: 'dndgen-deployment-website-tests'
    
    # Tag the release
  - bash: |
      echo "Tagging with version $(Build.BuildNumber)"
      git tag $(Build.BuildNumber)
      git push origin $(Build.BuildNumber)
    displayName: 'Tag Release Version'
    workingDirectory: $(Build.SourcesDirectory)

      
